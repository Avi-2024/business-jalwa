name: Verify Instagram Account
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-accounts.yml"
      - "scripts/check_account.mjs"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify Business Jalwa credentials (no publishing)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: node scripts/check_account.mjs
